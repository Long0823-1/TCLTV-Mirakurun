name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - run: sh scripts/build-runtime.sh
      - uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: |
            android/assets/runtime.tar.gz
            android/assets/runtime.sha256
  apk:
    needs: runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;36.0.0" "ndk;29.0.14206865"
      - uses: actions/download-artifact@v4
        with:
          name: runtime
          path: android/assets
      - shell: pwsh
        run: |
          ./scripts/build-native.ps1 -NdkRoot "$env:ANDROID_HOME/ndk/29.0.14206865"
          ./android/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TCLTV-Mirakurun-test-apk
          path: android/build/TCLTV-Mirakurun.apk
